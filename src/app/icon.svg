<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ot-icon-grad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <filter id="ot-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Radar Target Outer Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#ot-icon-grad)" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.5" />

  <!-- Solid Orbit Ring -->
  <circle cx="50" cy="50" r="36" stroke="url(#ot-icon-grad)" stroke-width="1.5" opacity="0.75" />

  <!-- Four Precision Crosshair Ticks (N, S, E, W) -->
  <line x1="50" y1="4" x2="50" y2="12" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="88" x2="50" y2="96" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="4" y1="50" x2="12" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="88" y1="50" x2="96" y2="50" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Core Dynamic Navigation Delta Arrow -->
  <g filter="url(#ot-icon-glow)">
    <path d="M50 18L76 74L50 62L24 74L50 18Z" fill="url(#ot-icon-grad)" />
    <path d="M50 24L70 70L50 60L50 24Z" fill="#ffffff" fill-opacity="0.32" />
    <circle cx="50" cy="52" r="3.5" fill="#ffffff" />
  </g>
</svg>
